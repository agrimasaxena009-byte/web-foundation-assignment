
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f8fafc;
        }

        h1 { text-align: center; color: #1e3a8a; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            max-width: 1100px;
            margin: 30px auto;
        }

        figure {
            margin: 0;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000015;
        }

        figure img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 7px;
        }

        figcaption {
            padding: 10px 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>My Photo Gallery</h1>

    <main class="gallery">
        <figure>
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500"
                 alt="Scenic landscape">
            <figcaption>Beautiful Landscape</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500"
                 alt="Mountain lake">
            <figcaption>Mountain Lake</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500"
                 alt="Green forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500"
                 alt="Beach and ocean">
            <figcaption>Sunny Beach</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500"
                 alt="Mountain peaks">
            <figcaption>Mountain Peaks</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=500"
                 alt="Wildlife in nature">
            <figcaption>Wildlife</figcaption>
        </figure>
    </main>
</body>
</html>
