
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 25px;
        }

        h1 { text-align: center; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
        }

        .item {
            background: white;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000012;
        }

        .item img {
            width: 100%;
            height: 160px;
            object-fit: contain;
        }

        .price { color: #15803d; font-weight: bold; }

        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Featured Products</h1>

    <main class="grid">
        <article class="item">
            <img src="https://placehold.co/250x180?text=Laptop" alt="Laptop">
            <h2>Laptop</h2>
            <p class="price">₹45,000</p>
            <button onclick="showProduct('Laptop')">View Product</button>
        </article>

        <article class="item">
            <img src="https://placehold.co/250x180?text=Phone" alt="Phone">
            <h2>Smartphone</h2>
            <p class="price">₹18,000</p>
            <button onclick="showProduct('Smartphone')">View Product</button>
        </article>

        <article class="item">
            <img src="https://placehold.co/250x180?text=Keyboard" alt="Keyboard">
            <h2>Keyboard</h2>
            <p class="price">₹1,200</p>
            <button onclick="showProduct('Keyboard')">View Product</button>
        </article>

        <article class="item">
            <img src="https://placehold.co/250x180?text=Mouse" alt="Mouse">
            <h2>Wireless Mouse</h2>
            <p class="price">₹700</p>
            <button onclick="showProduct('Wireless Mouse')">View Product</button>
        </article>
    </main>

    <script>
        function showProduct(name) {
            alert("You selected: " + name);
        }
    </script>
</body>
</html>
