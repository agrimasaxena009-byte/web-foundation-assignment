
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Styled Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        h2 {
            color: #2563eb;
        }

        p {
            line-height: 1.6;
            color: #444;
        }

        footer {
            text-align: center;
            background-color: #1e293b;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Welcome to My Website</h1>
        <p>Learning HTML and CSS</p>
    </header>

    <main>
        <h2>About This Website</h2>
        <p>
            This is my first styled webpage. I am learning how to use
            CSS to improve the appearance of an HTML page.
        </p>

        <h2>My Learning Goals</h2>
        <ul>
            <li>Learn HTML structure</li>
            <li>Understand CSS properties</li>
            <li>Create attractive webpages</li>
        </ul>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
</body>
</html>
