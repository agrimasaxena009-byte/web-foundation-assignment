<!-- Professional Job Application Form -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <style>
    body {
      margin: 0;
      padding: 25px;
      background: #f1f4f8;
      color: #263238;
      font-family: Arial, sans-serif;
    }

    form {
      max-width: 800px;
      margin: auto;
      
      padding: 30px;
      background: white;
      border-radius: 10px;
    }

    fieldset {
      margin: 20px 0;
      padding: 18px;
      border: 1px solid #ccd3dc;
      border-radius: 6px;
    }

    legend {
      padding: 0 8px;
      font-weight: bold;
      color: #203354;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    .checkbox-label {
      font-weight: normal;
    }

    .checkbox-label input {
      width: auto;
    }

    button {
      padding: 12px 20px;
      margin-right: 8px;
      border: 0;
      border-radius: 5px;
      background: #203354;
      color: white;
      cursor: pointer;
    }

    button[type="reset"] {
      background: #64748b;
    }
  </style>
</head>
<body>
  <form action="#" method="post" enctype="multipart/form-data">
    <h1>Job Application Form</h1>
    <p>Please complete all required fields to apply for this position.</p>

    <fieldset>
      <legend>Personal Information</legend>

      <label for="name">Full Name *</label>
      <input type="text" id="name" name="name" autocomplete="name" required>

      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="phone">Phone Number *</label>
      <input type="tel" id="phone" name="phone" autocomplete="tel" required>

      <label for="location">Current City / Location</label>
      <input type="text" id="location" name="location">
    </fieldset>

    <fieldset>
      <legend>Position Details</legend>

      <label for="position">Position Applying For *</label>
      <select id="position" name="position" required>
        <option value="">Select a position</option>
        <option value="web-developer">Junior Web Developer</option>
        <option value="designer">Graphic Designer</option>
        <option value="marketing-assistant">Marketing Assistant</option>
        <option value="other">Other</option>
      </select>

      <label for="start-date">Available Start Date</label>
      <input type="date" id="start-date" name="start-date">

      <label for="salary">Expected Annual Salary</label>
      <input type="number" id="salary" name="salary" min="0" step="1000">
    </fieldset>

    <fieldset>
      <legend>Education and Experience</legend>

      <label for="education">Highest Level of Education *</label>
      <select id="education" name="education" required>
        <option value="">Select education level</option>
        <option value="high-school">High School</option>
        <option value="diploma">Diploma</option>
        <option value="bachelors">Bachelor's Degree</option>
        <option value="masters">Master's Degree</option>
        <option value="other">Other</option>
      </select>

      <label for="experience">Years of Experience</label>
      <input type="number" id="experience" name="experience" min="0" max="50">

      <label for="resume">Upload Resume (PDF or Word document) *</label>
      <input
        type="file"
        id="resume"
        name="resume"
        accept=".pdf,.doc,.docx"
        required
      >

      <label for="cover-letter">Cover Letter</label>
      <textarea id="cover-letter" name="cover-letter" rows="6"
        placeholder="Briefly introduce yourself and explain why you are applying."></textarea>
    </fieldset>

    <label class="checkbox-label">
      <input type="checkbox" name="accuracy" required>
      I confirm that the information in this application is accurate. *
    </label>

    <button type="submit">Submit Application</button>
    <button type="reset">Clear Form</button>
  </form>
</body>
</html>
