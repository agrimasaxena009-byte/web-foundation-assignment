
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eff6ff;
            padding: 30px 15px;
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000015;
        }

        h1 { color: #1d4ed8; text-align: center; }

        label { display: block; margin-top: 15px; }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        #result { margin-top: 20px; line-height: 1.7; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Grade Calculator</h1>

        <form id="gradeForm">
            <label for="marks">Enter marks (0–100)</label>
            <input type="number" id="marks" min="0" max="100" required>

            <button type="submit">Calculate Grade</button>
        </form>

        <div id="result" aria-live="polite"></div>
    </main>

    <script>
        document.getElementById("gradeForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const marks = Number(document.getElementById("marks").value);
            const result = document.getElementById("result");

            if (marks < 0 || marks > 100) {
                result.textContent = "Please enter marks between 0 and 100.";
            } else {
                let grade;

                if (marks >= 90) {
                    grade = "A+";
                } else if (marks >= 80) {
                    grade = "A";
                } else if (marks >= 70) {
                    grade = "B";
                } else if (marks >= 60) {
                    grade = "C";
                } else if (marks >= 40) {
                    grade = "D";
                } else {
                    grade = "Fail";
                }

                result.textContent = "Marks: " + marks + " | Grade: " + grade;
            }
        });
    </script>
</body>
</html>
