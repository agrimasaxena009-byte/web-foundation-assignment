
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            padding: 22px;
            text-align: center;
            background: #1d4ed8;
            color: white;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            padding: 30px;
        }

        .product {
            background: white;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 3px 10px #00000010;
        }

        .product img {
            width: 100%;
            height: 170px;
            object-fit: contain;
        }

        .price { color: #15803d; font-weight: bold; }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Online Store</h1>
        <p>Explore our featured products</p>
    </header>

    <main class="products">
        <article class="product">
            <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
            <h2>Headphones</h2>
            <p>Comfortable headphones for everyday use.</p>
            <p class="price">₹999</p>
            <button onclick="addToCart('Headphones')">Add to Cart</button>
        </article>

        <article class="product">
            <img src="https://placehold.co/300x200?text=Watch" alt="Watch">
            <h2>Smart Watch</h2>
            <p>A stylish watch for your daily routine.</p>
            <p class="price">₹1,499</p>
            <button onclick="addToCart('Smart Watch')">Add to Cart</button>
        </article>

        <article class="product">
            <img src="https://placehold.co/300x200?text=Backpack" alt="Backpack">
            <h2>Backpack</h2>
            <p>A useful bag for college and travel.</p>
            <p class="price">₹799</p>
            <button onclick="addToCart('Backpack')">Add to Cart</button>
        </article>
    </main>

    <script>
        function addToCart(productName) {
            alert(productName + " added to your demo cart!");
        }
    </script>
</body>
</html>
